[project]
authors = [{name = "natthan-pigoux", email = "natthan-pigoux@users.noreply.github.com"}]
dependencies = ["cwltool", "ctapipe==0.30.0", "eventio~=2.1", "typer"]
name = "duw_cwl_hands_on"
requires-python = ">= 3.12"
version = "0.1.0"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-requirements"]

[build-system]
requires = ["setuptools>=65", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
duw_cwl_hands_on = { path = ".", editable = true }

[tool.pixi.tasks]
create-dl0-dl2-input = { cmd = "create-dl0-dl2-input", description = "Get a CTAO Simulation dataset."}
create-multi-dl1-input = { cmd = "create-multi-dl1-input", description = "Create multiple DL1 input files."}

[project.scripts]
create-dl0-dl2-input = "duw_cwl_hands_on.cli.create_dl0_dl2_input:app"
create-multi-dl1-input = "duw_cwl_hands_on.cli.create_multiple_dl1_inputs:app"