[project]
authors = [{name = "natthan-pigoux", email = "natthan-pigoux@users.noreply.github.com"}]
dependencies = ["cwltool", "ctapipe==0.30.0", "eventio~=2.1"]
name = "duw_cwl_hands_on"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
requires = ["setuptools>=65", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
duw_cwl_hands_on = { path = ".", editable = true }

[tool.pixi.tasks]
download-dataset = { cmd = "python src/duw_cwl_hands_on/get_dataset.py", description = "Get a CTAO Simulation dataset."}
create-multiple-dl1 = { cmd = "python src/duw_cwl_hands_on/create_multiple_dl1.py", description = "Create multiple DL1 input files."}

[tool.pixi.environments]
default = { solve-group = "default" }